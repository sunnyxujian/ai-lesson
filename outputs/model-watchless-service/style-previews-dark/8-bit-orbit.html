<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>前向传播 · A · 霓虹矩阵</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Space+Mono:wght@400;700&amp;family=Tektur:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --neon-pink: #F0A6CA;
      --neon-cyan: #5EDCF4;
      --neon-yellow: #F4D03F;
      --deep-navy: #0F1B3D;
      --dark-void: #0A0E27;
      --soft-lavender: #E2D5F2;
      --pixel-size: 4px;
      --font-display: 'Tektur', cursive;
      --font-body: 'Chakra Petch', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--dark-void);
      background: var(--dark-void);
    }

    /* Scroll behavior for slide navigation */
    .deck {
      width: 100%;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    .slides-container {
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide {
      width: 100%;
      height: 1080px;
      min-height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32.4px 76.8px;
    }

    /* === GLOBAL ATMOSPHERIC OVERLAYS === */

    /* Scanlines */
    .scanlines::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(10, 14, 39, 0.04) 2px,
        rgba(10, 14, 39, 0.04) 4px
      );
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: multiply;
    }

    /* Grain / Noise */
    .grain::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 49;
    }

    /* CRT vignette glow */
    .crt-glow::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(10, 14, 39, 0.25) 100%);
      pointer-events: none;
      z-index: 51;
    }

    /* Pixel grid background pattern */
    .bg-grid {
      background-color: var(--dark-void);
      background-image:
        linear-gradient(rgba(94, 220, 244, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 220, 244, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-grid-pink {
      background-color: var(--neon-pink);
      background-image:
        linear-gradient(rgba(15, 27, 61, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 27, 61, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-grid-cyan {
      background-color: var(--neon-cyan);
      background-image:
        linear-gradient(rgba(15, 27, 61, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 27, 61, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-grid-lavender {
      background-color: var(--soft-lavender);
      background-image:
        linear-gradient(rgba(15, 27, 61, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 27, 61, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Moving starfield for dark slides */
    .starfield {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .starfield .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--neon-cyan);
      opacity: 0.6;
      animation: twinkle 3s infinite ease-in-out;
    }

    .starfield .star:nth-child(2n) { background: var(--neon-yellow); }
    .starfield .star:nth-child(3n) { background: var(--neon-pink); }
    .starfield .star:nth-child(4n) { width: 6px; height: 6px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }

    /* Floating pixel particles */
    .pixel-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .pixel-particles .p {
      position: absolute;
      width: 8px;
      height: 8px;
      opacity: 0.4;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(90deg); }
    }

    /* === PIXEL UI COMPONENTS === */

    /* Pixel border effect */
    .pixel-box {
      position: relative;
      background: var(--deep-navy);
      color: white;
    }

    .pixel-box::before {
      content: "";
      position: absolute;
      inset: -4px;
      background: var(--neon-cyan);
      z-index: -1;
      clip-path: polygon(
        0 4px, 4px 4px, 4px 0,
        calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
        100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
        4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
      );
    }

    .pixel-box.yellow::before { background: var(--neon-yellow); }
    .pixel-box.pink::before { background: var(--neon-pink); }

    /* Pixel button */
    .pixel-btn {
      display: inline-block;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 36px;
      background: var(--neon-cyan);
      color: var(--deep-navy);
      border: none;
      cursor: pointer;
      position: relative;
      box-shadow:
        4px 0 0 0 var(--deep-navy),
        0 4px 0 0 var(--deep-navy),
        4px 4px 0 0 var(--deep-navy),
        8px 4px 0 0 var(--neon-yellow),
        4px 8px 0 0 var(--neon-yellow),
        8px 8px 0 0 var(--neon-yellow);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .pixel-btn:hover {
      transform: translate(2px, 2px);
      box-shadow:
        2px 0 0 0 var(--deep-navy),
        0 2px 0 0 var(--deep-navy),
        2px 2px 0 0 var(--deep-navy),
        4px 2px 0 0 var(--neon-yellow),
        2px 4px 0 0 var(--neon-yellow),
        4px 4px 0 0 var(--neon-yellow);
    }

    .pixel-btn.pink-btn {
      background: var(--neon-pink);
      box-shadow:
        4px 0 0 0 var(--deep-navy),
        0 4px 0 0 var(--deep-navy),
        4px 4px 0 0 var(--deep-navy),
        8px 4px 0 0 var(--neon-cyan),
        4px 8px 0 0 var(--neon-cyan),
        8px 8px 0 0 var(--neon-cyan);
    }

    /* Pixel text shadow like the reference image */
    .pixel-hero-text {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(3rem, 192px, 8rem);
      line-height: 1.05;
      color: var(--neon-cyan);
      text-shadow:
        4px 4px 0 var(--neon-yellow),
        8px 8px 0 var(--deep-navy);
      letter-spacing: 0.04em;
    }

    /* Decorative pixel corners */
    .pixel-corners {
      position: relative;
    }

    .pixel-corners::before,
    .pixel-corners::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border: 4px solid var(--neon-cyan);
    }

    .pixel-corners::before {
      top: -8px;
      left: -8px;
      border-right: none;
      border-bottom: none;
    }

    .pixel-corners::after {
      bottom: -8px;
      right: -8px;
      border-left: none;
      border-top: none;
    }

    .pixel-corners.yellow-corners::before,
    .pixel-corners.yellow-corners::after { border-color: var(--neon-yellow); }

    .pixel-corners.pink-corners::before,
    .pixel-corners.pink-corners::after { border-color: var(--neon-pink); }

    /* Section labels */
    .pixel-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--neon-yellow);
      background: var(--deep-navy);
      padding: 6px 14px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    /* === SLIDE CONTENT LAYOUTS === */

    .slide-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.15;
    }

    h1 { font-size: clamp(2rem, 96px, 4rem); }
    h2 { font-size: clamp(1.5rem, 67.2px, 2.8rem); }
    h3 { font-size: clamp(1.1rem, 38.4px, 1.5rem); }
    p, li {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 23.04px, 1.15rem);
      line-height: 1.7;
      font-weight: 400;
    }

    /* === NAVIGATION === */
    .nav-dots {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .nav-dot {
      width: 12px;
      height: 12px;
      border: 2px solid var(--neon-cyan);
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
    }

    .nav-dot::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: var(--neon-cyan);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .nav-dot.active::after { opacity: 1; }
    .nav-dot:hover { border-color: var(--neon-yellow); }

    .slide-counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--neon-cyan);
      background: rgba(10, 14, 39, 0.8);
      padding: 8px 20px;
      z-index: 100;
      letter-spacing: 0.15em;
    }

    /* === CUSTOM CURSOR AREA === */
    .deck {
      cursor: crosshair;
    }

    /* === SPECIFIC SLIDE STYLES === */

    /* Slide 1: Hero */
    .hero-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--neon-pink);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero-tagline {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 28.8px, 1.2rem);
      color: rgba(255,255,255,0.7);
      max-width: 500px;
      text-align: center;
      margin-top: 2rem;
      line-height: 1.8;
    }

    .hero-badges {
      display: flex;
      gap: 16px;
      margin-top: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 2px solid var(--neon-yellow);
      color: var(--neon-yellow);
    }

    /* Slide 2: Split Intro */
    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 76.8px;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 1100px;
    }

    @media (max-width: 768px) {
      .split-layout { grid-template-columns: 1fr; }
    }

    .pixel-avatar-zone {
      width: 100%;
      aspect-ratio: 1;
      max-width: 380px;
      margin: 0 auto;
      background: var(--deep-navy);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pixel-avatar-zone::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 10px,
          rgba(94, 220, 244, 0.1) 10px,
          rgba(94, 220, 244, 0.1) 20px
        );
    }

    .pixel-face {
      width: 120px;
      height: 120px;
      position: relative;
    }

    .pixel-face .eye {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--neon-cyan);
      top: 30px;
    }

    .pixel-face .eye.left { left: 16px; }
    .pixel-face .eye.right { right: 16px; }

    .pixel-face .mouth {
      position: absolute;
      width: 60px;
      height: 16px;
      background: var(--neon-pink);
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Slide 3: Feature Grid */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 1000px;
    }

    @media (max-width: 900px) {
      .feature-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .feature-grid { grid-template-columns: 1fr; }
    }

    .feature-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 32px 24px;
      text-align: center;
      position: relative;
      border: 2px solid rgba(15, 27, 61, 0.2);
    }

    .feature-card::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      width: 16px;
      height: 16px;
      border-top: 4px solid var(--deep-navy);
      border-left: 4px solid var(--deep-navy);
    }

    .feature-card::after {
      content: "";
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 16px;
      height: 16px;
      border-bottom: 4px solid var(--deep-navy);
      border-right: 4px solid var(--deep-navy);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      position: relative;
    }

    .feature-icon.cube {
      background: var(--deep-navy);
      box-shadow: 6px 6px 0 var(--neon-yellow);
    }

    .feature-icon.diamond {
      background: var(--neon-cyan);
      transform: rotate(45deg);
      width: 36px;
      height: 36px;
      margin-bottom: 22px;
      margin-top: 6px;
    }

    .feature-icon.cross {
      background: var(--neon-pink);
      position: relative;
    }

    .feature-icon.cross::before,
    .feature-icon.cross::after {
      content: "";
      position: absolute;
      background: var(--deep-navy);
    }

    .feature-icon.cross::before { inset: 10px 4px; }
    .feature-icon.cross::after { inset: 4px 10px; }

    .feature-icon.circle {
      border: 6px solid var(--neon-yellow);
      border-radius: 0; /* pixel circle = square with careful shading? actually keep square for pixel aesthetic */
      background: transparent;
      position: relative;
    }

    .feature-icon.circle::after {
      content: "";
      position: absolute;
      inset: 8px;
      background: var(--neon-yellow);
    }

    .feature-card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--deep-navy);
    }

    .feature-card p {
      font-size: 0.85rem;
      color: rgba(15, 27, 61, 0.75);
      line-height: 1.6;
    }

    /* Slide 4 & 5: Charts */
    .chart-slide-layout {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pixel-chart-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pixel-chart-title h2 {
      color: var(--neon-cyan);
      margin-bottom: 0.5rem;
    }

    .pixel-chart-title .subtitle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--neon-pink);
      letter-spacing: 0.15em;
    }

    /* Bar Chart */
    .pixel-bar-chart {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 24px;
      height: 320px;
      padding: 0 20px;
      position: relative;
    }

    .pixel-bar-chart::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--neon-cyan);
      opacity: 0.5;
    }

    .chart-bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 100px;
    }

    .chart-bar {
      width: 100%;
      background: var(--neon-cyan);
      position: relative;
      box-shadow: 4px 0 0 0 var(--deep-navy), 0 4px 0 0 var(--deep-navy), 4px 4px 0 0 var(--deep-navy);
      transition: height 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chart-bar.alt { background: var(--neon-pink); }
    .chart-bar.alt2 { background: var(--neon-yellow); }

    .chart-bar-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.8);
      text-align: center;
      letter-spacing: 0.05em;
    }

    .chart-value {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-yellow);
      margin-bottom: 4px;
    }

    /* Horizontal Bar Chart */
    .pixel-hbar-chart {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hbar-row {
      display: grid;
      grid-template-columns: 120px 1fr 50px;
      align-items: center;
      gap: 16px;
    }

    .hbar-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--deep-navy);
      text-align: right;
      font-weight: 700;
    }

    .hbar-track {
      height: 32px;
      background: rgba(15, 27, 61, 0.1);
      position: relative;
    }

    .hbar-fill {
      height: 100%;
      background: var(--deep-navy);
      position: relative;
      box-shadow: 4px 4px 0 var(--neon-yellow);
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hbar-fill.alt { background: var(--neon-cyan); box-shadow: 4px 4px 0 var(--deep-navy); }
    .hbar-fill.alt2 { background: var(--neon-pink); box-shadow: 4px 4px 0 var(--deep-navy); }

    .hbar-value {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--deep-navy);
    }

    /* Slide 6: Timeline */
    .timeline-container {
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .timeline-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      background: repeating-linear-gradient(
        to bottom,
        var(--deep-navy) 0px,
        var(--deep-navy) 16px,
        transparent 16px,
        transparent 24px
      );
      transform: translateX(-50%);
    }

    .timeline-events {
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
    }

    .timeline-event {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      align-items: center;
      gap: 24px;
    }

    .timeline-event:nth-child(even) .timeline-text { grid-column: 3; text-align: left; }
    .timeline-event:nth-child(even) .timeline-spacer { grid-column: 2; }
    .timeline-event:nth-child(even) .timeline-empty { grid-column: 1; }

    .timeline-event:nth-child(odd) .timeline-text { grid-column: 1; text-align: right; }
    .timeline-event:nth-child(odd) .timeline-spacer { grid-column: 2; }
    .timeline-event:nth-child(odd) .timeline-empty { grid-column: 3; }

    .timeline-node {
      width: 24px;
      height: 24px;
      background: var(--neon-cyan);
      border: 4px solid var(--deep-navy);
      justify-self: center;
      position: relative;
      z-index: 2;
    }

    .timeline-node.active { background: var(--neon-yellow); }

    .timeline-text h4 {
      font-size: 1rem;
      color: var(--deep-navy);
      margin-bottom: 4px;
    }

    .timeline-text p {
      font-size: 0.85rem;
      color: rgba(15, 27, 61, 0.7);
      line-height: 1.5;
    }

    .timeline-text .date {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--neon-cyan);
      background: var(--deep-navy);
      display: inline-block;
      padding: 2px 10px;
      margin-bottom: 8px;
    }

    @media (max-width: 700px) {
      .timeline-event {
        grid-template-columns: 40px 1fr !important;
      }
      .timeline-event .timeline-empty { display: none; }
      .timeline-event .timeline-text { grid-column: 2 !important; text-align: left !important; }
      .timeline-line { left: 20px; }
      .timeline-node { justify-self: start; }
    }

    /* Slide 7: Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      width: 100%;
      max-width: 900px;
    }

   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;

}

(function() {
  const totalSlides = 1;
  let currentSlide = 0;
  const container = document.getElementById('slidesContainer');
  const counter = document.getElementById('slideCounter');
  const dotsContainer = document.getElementById('navDots');

  // Generate nav dots
  for (let i = 0; i < totalSlides; i++) {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToSlide(i));
    dotsContainer.appendChild(dot);
  }

  const dots = document.querySelectorAll('.nav-dot');

  function updateUI() {
    container.style.transform = `translateY(-${currentSlide * 100}vh)`;
    counter.textContent = String(currentSlide + 1).padStart(2, '0') + ' / ' + totalSlides;
    dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    triggerAnimations(currentSlide);
  }

  function goToSlide(index) {
    if (index < 0 || index >= totalSlides) return;
    currentSlide = index;
    updateUI();
  }

  function nextSlide() { goToSlide(currentSlide + 1); }
  function prevSlide() { goToSlide(currentSlide - 1); }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      nextSlide();
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      prevSlide();
    } else if (e.key === 'Home') {
      e.preventDefault();
      goToSlide(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      goToSlide(totalSlides - 1);
    }
  });

  // Touch / swipe support
  let touchStartY = 0;
  document.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
  document.addEventListener('touchend', (e) => {
    const diff = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diff) > 50) {
      diff > 0 ? nextSlide() : prevSlide();
    }
  });

  // Wheel support with debounce
  let wheelLock = false;
  document.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    wheelLock = true;
    e.deltaY > 0 ? nextSlide() : prevSlide();
    setTimeout(() => wheelLock = false, 800);
  }, { passive: true });

  // ===== ANIMATION TRIGGERS =====
  function triggerAnimations(slideIndex) {
    // Slide 4: Vertical bar chart
    if (slideIndex === 3) {
      document.querySelectorAll('#barChart .chart-bar').forEach((bar, i) => {
        const h = bar.dataset.height;
        setTimeout(() => {
          bar.style.height = h + '%';
        }, i * 120);
      });
      document.querySelectorAll('#barChart .chart-value').forEach((val, i) => {
        const target = parseInt(val.dataset.value);
        setTimeout(() => animateNumber(val, target, '', 800), i * 120);
      });
    } else {
      document.querySelectorAll('#barChart .chart-bar').forEach(bar => bar.style.height = '0%');
    }

    // Slide 5: Horizontal bar chart
    if (slideIndex === 4) {
      document.querySelectorAll('#hbarChart .hbar-fill').forEach((fill, i) => {
        const w = fill.dataset.width;
        setTimeout(() => { fill.style.width = w + '%'; }, i * 100);
      });
    } else {
      document.querySelectorAll('#hbarChart .hbar-fill').forEach(fill => fill.style.width = '0%');
    }

    // Slide 7: Stats counters
    if (slideIndex === 6) {
      document.querySelectorAll('#statsGrid .stat-number').forEach((el, i) => {
        const target = parseFloat(el.dataset.target);
        const suffix = el.dataset.suffix || '';
        const isFloat = target % 1 !== 0;
        setTimeout(() => animateNumber(el, target, suffix, 1200, isFloat), i * 150);
      });
    } else {
      document.querySelectorAll('#statsGrid .stat-number').forEach(el => el.textContent = '0');
    }
  }

  function animateNumber(el, target, suffix, duration, isFloat = false) {
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = eased * target;
      el.textContent = (isFloat ? current.toFixed(1) : Math.floor(current)) + suffix;
      if (progress < 1) requestAnimationFrame(tick);
      else el.textContent = (isFloat ? target.toFixed(1) : target) + suffix;
    }
    requestAnimationFrame(tick);
  }

  // ===== GENERATE STARFIELD =====
  function generateStars(containerId, count = 40) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      container.appendChild(star);
    }
  }

  generateStars('starfield1', 50);
  generateStars('starfield4', 30);
  generateStars('starfield7', 35);
  generateStars('starfield10', 45);

  // ===== GENERATE FLOATING PARTICLES =====
  function generateParticles(containerId, colors, count = 12) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'p';
      const color = colors[i % colors.length];
      p.style.background = color;
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 5 + 's';
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      container.appendChild(p);
    }
  }

  generateParticles('particles1', ['var(--neon-cyan)', 'var(--neon-pink)', 'var(--neon-yellow)'], 16);
  generateParticles('particles10', ['var(--neon-cyan)', 'var(--neon-pink)', 'var(--neon-yellow)'], 20);

  // ===== GENERATE PIXEL LANDSCAPE FOR CTA =====
  function generateLandscape() {
    const container = document.getElementById('landscape10');
    if (!container) return;
    const heights = [30, 50, 70, 40, 60, 35, 55, 45, 80, 25, 50, 40];
    heights.forEach((h, i) => {
      const mtn = document.createElement('div');
      mtn.className = 'mountain';
      mtn.style.height = h + 'px';
      mtn.style.width = (60 + (i % 3) * 20) + 'px';
      container.appendChild(mtn);
    });
  }
  generateLandscape();

  // Initialize
  updateUI();
})();
