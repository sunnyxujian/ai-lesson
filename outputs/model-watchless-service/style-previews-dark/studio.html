<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>前向传播 · B · 黑金极客</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!--
      Studio style uses three font families:
        1. Barlow 900       — the entire display and heading system; becomes graphic at scale
        2. Barlow 400/500   — body, lead paragraphs
        3. IBM Plex Mono    — footer metadata, slide counters, caption labels
        4. Noto Sans SC     — Chinese fallback for all roles
    -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;800;900&amp;family=IBM+Plex+Mono:wght@300;400;500&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<style>
      /* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ZONE A · TOKENS  —  STUDIO STYLE                                    ║
   ║                                                                      ║
   ║  Replace this block to change the visual style entirely.             ║
   ║  Every color, font, and size in this file reads from these vars.     ║
   ║  Never write raw hex values, font names, or px sizes outside here.   ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
      :root {
        /* ── Palette ──────────────────────────────────────────────────────── */
        /* Near-black: the dark slide background — warm dark, not cold neutral */
        --c-bg: #1c1c1c;
        /* Slightly lighter near-black for secondary dark surfaces */
        --c-bg-alt: #242422;
        /* Acid yellow: THE light slide background — yellow is the environment, not an accent */
        --c-bg-light: #f5d200;
        /* Slightly cooler yellow for secondary light surfaces */
        --c-bg-light-alt: #f0cc00;

        /* Primary text on dark: acid yellow — the only colour on dark slides */
        --c-fg: #f5d200;
        /* Secondary text on dark: yellow at 58% opacity — muted but still warm */
        --c-fg-2: rgba(245, 210, 0, 0.58);
        /* Tertiary / hint text on dark: yellow at 32% */
        --c-fg-3: rgba(245, 210, 0, 0.32);
        /* Primary text on light: near-black on yellow */
        --c-fg-light: #1c1c1c;
        /* Secondary text on light: near-black at 62% */
        --c-fg-light-2: rgba(28, 28, 28, 0.62);
        /* Tertiary text on light */
        --c-fg-light-3: rgba(28, 28, 28, 0.35);

        /* Accent: yellow on dark / same yellow (var reused by engine) */
        --c-accent: #f5d200;
        /* Dividers on dark: very dark warm border */
        --c-border: #2e2e2c;
        /* Dividers on light: near-black at 18% opacity on yellow */
        --c-border-light: rgba(28, 28, 28, 0.18);

        /* ── Typography ──────────────────────────────────────────────────── */
        /* Display + Heading: Barlow 900 — grotesque at max weight becomes a graphic object */
        --f-display: "Barlow", "Noto Sans SC", sans-serif;
        --f-heading: "Barlow", "Noto Sans SC", sans-serif;
        /* Body: Barlow 400/500 — same family, steps back as weight drops */
        --f-body: "Barlow", "Noto Sans SC", system-ui, sans-serif;
        /* Mono: IBM Plex Mono — metadata, counters, footer columns */
        --f-mono: "IBM Plex Mono", monospace;

        /* ── Type Scale ───────────────────────────────────────────────────── */
        /* Studio runs type LARGER than Signal — the headline IS the layout */
        --sz-display: 230.4px; /* cover hero — type at maximum scale */
        --sz-h1: 144px; /* chapter titles, statement headlines */
        --sz-h2: 92.16px; /* section headers */
        --sz-h3: 53.76px; /* sub-headlines */
        --sz-lead: 30.72px; /* intro paragraphs */
        --sz-body: 22.08px; /* body text, bullets */
        --sz-caption: 16.32px; /* captions, footnotes */
        --sz-label: 13.824px; /* mono metadata, chrome */

        /* ── Spacing ─────────────────────────────────────────────────────── */
        /* Studio pads tighter than Signal — type runs to near-edge */
        --pad-x: 96px;
        --pad-y: 54px;
        --gap-lg: 37.8px;
        --gap-md: 21.6px;
        --gap-sm: 10.8px;

        /* ── Motion ──────────────────────────────────────────────────────── */
        /* Harder, sharper transitions — agency urgency, not editorial grace */
        --ease-slide: cubic-bezier(0.77, 0, 0.175, 1);
        --dur-slide: 0.75s;
        --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
        --dur-enter: 0.5s;
      }

      /* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ZONE B · ENGINE — DO NOT MODIFY                                     ║
   ║                                                                      ║
   ║  Layout engine, transitions, animation system, navigation.           ║
   ║  Touching this breaks the mechanics.                                 ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--c-bg);
        -webkit-font-smoothing: antialiased;
      }

      /* Deck container — all slides sit side by side in one horizontal strip */
      #deck {
        display: flex;
        height: 1080px;
        transition: transform var(--dur-slide) var(--ease-slide);
        will-change: transform;
      }

      /* Slide base — each slide occupies exactly one full viewport */
      .slide {
        flex: 0 0 1920px;
        width: 1920px;
        height: 1080px;
        position: relative;
        padding: var(--pad-y) var(--pad-x);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }
      .slide-body {
        min-height: 0;
      }

      /* Slide themes */
      .slide.dark {
        background: var(--c-bg);
        color: var(--c-fg);
      }
      .slide.light {
        background: var(--c-bg-light);
        color: var(--c-fg-light);
      }

      /* ── Animation system ─────────────────────────────────────────────── */
      /* Elements start invisible; become visible only when slide is active */
      [data-anim] {
        opacity: 0;
      }
      .slide.is-active [data-anim] {
        animation-duration: var(--dur-enter);
        animation-timing-function: var(--ease-enter);
        animation-fill-mode: forwards;
      }
      .slide.is-active [data-anim="fade-up"] {
        animation-name: kFadeUp;
      }
      .slide.is-active [data-anim="fade-in"] {
        animation-name: kFadeIn;
      }
      .slide.is-active [data-anim="reveal-right"] {
        animation-name: kRevealRight;
      }
      .slide.is-active [data-anim="reveal-left"] {
        animation-name: kRevealLeft;
      }
      .slide.is-active [data-anim="scale-in"] {
        animation-name: kScaleIn;
      }

      /* Staggered delays via data-delay attribute (0–6) */
      [data-delay="0"] {
        animation-delay: 0s;
      }
      [data-delay="1"] {
        animation-delay: 0.08s;
      }
      [data-delay="2"] {
        animation-delay: 0.18s;
      }
      [data-delay="3"] {
        animation-delay: 0.3s;
      }
      [data-delay="4"] {
        animation-delay: 0.44s;
      }
      [data-delay="5"] {
        animation-delay: 0.6s;
      }
      [data-delay="6"] {
        animation-delay: 0.78s;
      }

      @keyframes kFadeUp {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes kFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes kRevealRight {
        from {
          clip-path: inset(0 100% 0 0);
          opacity: 1;
        }
        to {
          clip-path: inset(0 0% 0 0);
          opacity: 1;
        }
      }
      @keyframes kRevealLeft {
        from {
          clip-path: inset(0 0 0 100%);
          opacity: 1;
        }
        to {
          clip-path: inset(0 0 0 0%);
          opacity: 1;
        }
      }
      @keyframes kScaleIn {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ── Navigation UI ───────────────────────────────────────────────── */
      #nav-dots {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
        z-index: 100;
      }
      .nav-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.22);
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.3s;
        padding: 0;
      }
      .nav-dot.is-active {
        background: rgba(255, 255, 255, 0.8);
        transform: scale(1.4);
      }

      #slide-counter {
        position: fixed;
        bottom: 20px;
        right: 28px;
        font-family: var(--f-mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.25);
        z-index: 100;
        user-select: none;
      }

      /* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ZONE C · TYPOGRAPHY  —  STUDIO OVERRIDES                            ║
   ║                                                                      ║
   ║  All headings: weight 900, uppercase, tight tracking.                ║
   ║  The headline is not decoration — it IS the design.                  ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

      /* Display: maximum weight, maximum scale, uppercase — type as visual mass */
      .display {
        font-size: var(--sz-display);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        font-family: var(--f-display);
      }
      .h1 {
        font-size: var(--sz-h1);
        font-weight: 900;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        font-family: var(--f-heading);
      }
      .h2 {
        font-size: var(--sz-h2);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        font-family: var(--f-heading);
      }
      .h3 {
        font-size: var(--sz-h3);
        font-weight: 700;
        line-height: 1.1;
        text-transform: uppercase;
        font-family: var(--f-heading);
      }
      .lead {
        font-size: var(--sz-lead);
        font-weight: 500;
        line-height: 1.45;
        font-family: var(--f-body);
      }
      .body {
        font-size: var(--sz-body);
        font-weight: 400;
        line-height: 1.6;
        font-family: var(--f-body);
      }
      .caption {
        font-size: var(--sz-caption);
        font-weight: 400;
        line-height: 1.5;
        font-family: var(--f-body);
      }
      /* Label: mono metadata — the only non-bold text that gets prominence */
      .label {
        font-size: var(--sz-label);
        font-weight: 500;
        letter-spacing: 0.06em;
        font-family: var(--f-mono);
      }

      /* Muted variants — context-aware opacity */
      .muted {
        color: var(--c-fg-2);
      }
      .light .muted {
        color: var(--c-fg-light-2);
      }

      /* Accent colour class */
      .accent {
        color: var(--c-accent);
      }
      /* On light slides, accent is the dark foreground */
      .light .accent {
        color: var(--c-fg-light);
      }

      /* Bullet list — Studio signature: dash bullet in accent, tight spacing */
      .bullet-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: var(--gap-sm);
        font-family: var(--f-body);
        font-size: var(--sz-body);
        font-weight: 400;
        line-height: 1.5;
        padding-left: 1em;
      }
      .bullet-list li::before {
        content: "\2014"; /* em dash used as bullet marker */
        margin-left: -1em;
        margin-right: 0.5em;
        color: var(--c-accent);
      }
      .light .bullet-list li::before {
        color: var(--c-fg-light);
      }

      /* ── Studio cover footer: three-column metadata bar ──────────────────── */
      /* The signature Boring Studios three-column foot: studio × client, title, name */
      .cover-footer {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0;
        padding-top: var(--gap-md);
        border-top: 1px solid var(--c-fg-3);
        margin-top: auto;
      }
      .cover-footer-col {
        font-family: var(--f-mono);
        font-size: var(--sz-caption);
        font-weight: 400;
        line-height: 1.5;
      }
      .cover-footer-col:last-child {
        text-align: right;
      }

      /* Image placeholder box — dark warm grey rectangle, mono label centered */
      .img-placeholder {
        background: var(--c-bg-alt);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--f-mono);
        font-size: var(--sz-label);
        letter-spacing: 0.1em;
        color: var(--c-fg-3);
        width: 100%;
        flex: 1;
      }
      .light .img-placeholder {
        background: var(--c-bg-light-alt);
        color: var(--c-fg-light-3);
        border: 1px solid var(--c-border-light);
      }

      /* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ZONE D · CHROME                                                     ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

      /* Chrome (top bar) and footer */
      .slide-chrome,
      .slide-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .slide-chrome {
        padding-bottom: var(--gap-sm);
        border-bottom: 1px solid var(--c-border);
        margin-bottom: var(--gap-md);
      }
      .slide-foot {
        padding-top: var(--gap-sm);
        border-top: 1px solid var(--c-border);
        margin-top: var(--gap-md);
      }
      .light .slide-chrome,
      .light .slide-foot {
        border-color: var(--c-border-light);
      }

      /* Special layouts that don't use chrome/foot */
      .slide--cover .slide-chrome,
      .slide--cover .slide-foot,
      .slide--chapter .slide-chrome,
      .slide--chapter .slide-foot,
      .slide--quote .slide-chrome,
      .slide--quote .slide-foot,
      .slide--statement .slide-chrome,
      .slide--statement .slide-foot,
      .slide--end .slide-chrome,
      .slide--end .slide-foot {
        display: none;
      }

      /* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ZONE E · LAYOUT PATTERNS  —  STUDIO-SPECIFIC                       ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

      /* 1. COVER ─────────────────────────────────────────────────────────── */
      /* Full dark slide, image placeholder fills the background, type overlaid */
      .slide--cover {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 0;
        position: relative;
      }
      /* Image placeholder sits absolute behind everything */
      .cover-img-area {
        position: absolute;
        inset: 0;
        background: var(
          --c-bg-alt
        ); /* warm dark placeholder — replace with real image */
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--f-mono);
        font-size: var(--sz-label);
        letter-spacing: 0.1em;
        color: var(--c-fg-3);
      }
      /* Type area: z-index above the image, padded normally */
      .cover-type {
        position: relative;
        z-index: 1;
        padding: var(--pad-y) var(--pad-x) 0;
        flex: 1;
        display: flex;
        align-items: flex-start;
      }
      /* Three-column meta footer over the image */
      .cover-meta {
        position: relative;
        z-index: 1;
        padding: var(--gap-md) var(--pad-x) var(--pad-y);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0;
        border-top: 1px solid rgba(245, 210, 0, 0.25);
      }
      .cover-meta-col {
        font-family: var(--f-mono);
        font-size: var(--sz-caption);
        font-weight: 400;
        line-height: 1.6;
        color: var(--c-fg-2);
      }
      .cover-meta-col:last-child {
        text-align: right;
      }

      /* 2. CHAPTER ───────────────────────────────────────────────────────── */
      /* Yellow or dark chapter divider — huge uppercase section number + title */
      .slide--chapter {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: calc(var(--pad-y) * 1.5);
      }
      .chapter-num {
        font-family: var(--f-mono);
        font-size: var(--sz-label);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--c-fg-2);
        margin-bottom: var(--gap-lg);
      }
      .light .chapter-num {
        color: var(--c-fg-light-2);
      }

      /* 3. STATEMENT ─────────────────────────────────────────────────────── */
      /* Full-slide statement — huge uppercase type, zero decoration */
      .slide--statement {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: calc(var(--pad-y) * 1.5);
      }
      .statement-body {
        display: flex;
        flex-direction: column;
        gap: var(--gap-md);
      }

      /* 4. SPLIT ─────────────────────────────────────────────────────────── */
      .slide--split .slide-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(var(--pad-x) * 0.8);
        align-items: center;
      }
      .split-text {
        display: flex;
        flex-direction: column;
        gap: var(--gap-md);
      }
      .split-image {
        display: flex;
        flex-direction: column;
        gap: var(--gap-sm);
        height: 100%;
      }

      /* 5. STATS ─────────────────────────────────────────────────────────── */
      .slide--stats {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .slide--stats .slide-body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--gap-lg);
      }
      /* Stats numbers: huge weight-900 display, near-black on yellow */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
      }
      .stat-card {
        display: flex;
        flex-direction: column;
        gap: var(--gap-sm);
        padding: var(--gap-md) var(--gap-md) var(--gap-md) 0;
        border-top: 2px solid var(--c-fg-light);
      }
      .dark .stat-card {
        border-top-color: var(--c-fg-3);
      }
      /* Value: weight-900 display type — the number IS the stat */
      .stat-value {
        font-family: var(--f-display);
        font-size: 105.6px;
        font-weight: 900;
        line-height: 0.9;
        color: var(--c-fg-light);
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .dark .stat-value {
        color: var(--c-fg);
      }
      .stat-label {
        font-family: var(--f-body);
        font-size: var(--sz-body);
        font-weight: 500;
        line-height: 1.4;
      }
      .stat-note {
        font-family: var(--f-mono);
        font-size: var(--sz-caption);
        letter-spacing: 0.05em;
        color: var(--c-fg-light-3);
      }
      .dark .stat-note {
        color: var(--c-fg-3);
      }

      /* 6. LIST ─────────────────────────────────────────────────────────── */
      .slide--list {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .slide--list .slide-body {
        display: grid;
        grid-template-columns: 2fr 3fr;
        gap: calc(var(--pad-x) * 0.8);
        align-items: center;
      }
      .list-head {
        display: flex;
        flex-direction: column;
        gap: var(--gap-md);
      }

      /* 7. QUOTE ─────────────────────────────────────────────────────────── */
      /* Dark slide — large quote with no quote mark, just raw type */
      .slide--quote {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .quote-text {
        font-family: var(--f-heading);
        font-size: 72.96px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        max-width: 82%;
        margin-bottom: var(--gap-lg);
      }
      .quote-attr {
        display: flex;
        flex-direction: column;
        gap: 4.32px;
      }

      /* 8. COMPARE ─────────────────────────────────────────────────────────── */
      .slide--compare .slide-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 100%;
      }
      .compare-panel {
        display: flex;
        flex-direction: column;
        gap: var(--gap-md);
        padding: var(--gap-md) 0;
      }
      .compare-panel.left {
        padding-right: calc(var(--pad-x) * 0.55);
        border-right: 2px solid var(--c-fg-light);
      }
      .compare-panel.right {
        padding-left: calc(var(--pad-x) * 0.55);
      }
      .dark .compare-panel.left {
        border-right-color: var(--c-fg-3);
      }
      .compare-label {
        font-family: var(--f-mono);
        font-size: var(--sz-label);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding-bottom: var(--gap-sm);
        border-bottom: 1px solid var(--c-border-light);
      }
      .dark .compare-label {
        border-bottom-color: var(--c-border);
      }
      .compare-label.after {
        color: var(--c-accent);
      }
      .light .compare-label.after {
        color: var(--c-fg-light);
        font-weight: 700;
      }

      /* 9. CHART ─────────────────────────────────────────────────────────── */
      .slide--chart .slide-body {
        display: flex;
        flex-direction: column;
        gap: var(--gap-md);
        min-height: 0;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-shrink: 0;
      }
      .chart-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 0;
      }
      /* Bar chart track: bars sit in a horizontal row along a baseline */
      .bar-track {
        height: 324px;
        display: flex;
        align-items: flex-end;
        gap: 76.8px;
        border-left: 2px solid var(--c-fg-3);
        padding-left: 9.6px;
      }
      .light .bar-track {
        border-left-color: var(--c-border-light);
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 10.8px;
        height: 100%;
      }
      /* Bar fill: default is dark muted, accent is full yellow */
      .bar-fill {
        width: 100%;
        background: var(--c-fg-3);
      }
      .bar-fill.accent {
        background: var(--c-accent);
      }

   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

      /* ══════════════════════════════════════════════════════════════════════
         STUDIO PRESENTATION ENGINE
         Self-contained navigation: keyboard, touch, mouse-wheel, nav-dots.
         No external dependencies.
         ══════════════════════════════════════════════════════════════════════ */
      (function () {
        "use strict";

        /* ── State ─────────────────────────────────────────────────────────── */
        const deck = document.getElementById("deck");
        const slides = Array.from(document.querySelectorAll(".slide"));
        const dotsEl = document.getElementById("nav-dots");
        const counter = document.getElementById("slide-counter");
        const total = slides.length;
        let current = 0;
        let animating = false;

        /* ── Bootstrap: set deck width, build nav dots ─────────────────────── */
        function init() {
          // The deck is one wide strip — width equals N full viewports
          deck.style.width = total + "00vw";

          // Build one dot per slide
          slides.forEach(function (_, i) {
            const btn = document.createElement("button");
            btn.className = "nav-dot";
            btn.setAttribute("aria-label", "Go to slide " + (i + 1));
            btn.addEventListener("click", function () {
              goTo(i);
            });
            dotsEl.appendChild(btn);
          });

          // Activate the first slide immediately
          goTo(0, true); // true = skip transition on load
        }

        /* ── goTo: the single source of truth for navigation ───────────────── */
        function goTo(index, instant) {
          // Clamp to valid range
          index = Math.max(0, Math.min(total - 1, index));
          if (index === current && !instant) return;

          // Mark animating to block rapid key/swipe spam
          animating = true;

          // Deactivate current slide: reset animations by toggling is-active
          const prev = slides[current];
          prev.classList.remove("is-active");
          // Force a reflow so removing then re-adding is-active (on same slide)
          // actually re-triggers the keyframe animations
          void prev.offsetWidth; // eslint-disable-line no-void

          if (instant) {
            // Remove transition temporarily for the initial load snap
            deck.style.transition = "none";
            deck.style.transform = "translateX(-" + index + "00vw)";
            void deck.offsetWidth; // force reflow
            deck.style.transition = "";
          } else {
            deck.style.transform = "translateX(-" + index + "00vw)";
          }

          // Activate new slide
          current = index;
          const next = slides[current];
          next.classList.add("is-active");

          // Update nav dots
          Array.from(dotsEl.children).forEach(function (dot, i) {
            dot.classList.toggle("is-active", i === current);
          });

          // Update counter: "3 / 12"
          counter.textContent = current + 1 + " / " + total;

          // Unlock after transition completes
          const delay = instant
            ? 0
            : parseFloat(getComputedStyle(deck).transitionDuration) * 1000;
          setTimeout(function () {
            animating = false;
          }, delay);
        }

        /* ── Keyboard navigation ──────────────────────────────────────────── */
        document.addEventListener("keydown", function (e) {
          if (animating) return;
          if (
            e.key === "ArrowRight" ||
            e.key === "ArrowDown" ||
            e.key === " "
          ) {
            e.preventDefault();
            goTo(current + 1);
          } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            e.preventDefault();
            goTo(current - 1);
          } else if (e.key === "Home") {
            e.preventDefault();
            goTo(0);
          } else if (e.key === "End") {
            e.preventDefault();
            goTo(total - 1);
          }
        });

        /* ── Mouse-wheel navigation ───────────────────────────────────────── */
        let wheelCooldown = false;
        document.addEventListener(
          "wheel",
          function (e) {
            e.preventDefault();
            if (animating || wheelCooldown) return;
            wheelCooldown = true;
            setTimeout(function () {
              wheelCooldown = false;
            }, 900);
            if (e.deltaY > 0 || e.deltaX > 0) {
              goTo(current + 1);
            } else {
              goTo(current - 1);
            }
          },
          { passive: false },
        );

        /* ── Touch swipe navigation ───────────────────────────────────────── */
        let touchStartX = null;
        let touchStartY = null;

        document.addEventListener(
          "touchstart",
          function (e) {

            touchStartY = e.touches[0].clientY;
          },

          "touchend",

              } else {
                goTo(current - 1); // swipe right: prev
              }
            }
            touchStartX = null;
            touchStartY = null;
          },
          { passive: true },
        );

        /* ── Boot ─────────────────────────────────────────────────────────── */

      })();
