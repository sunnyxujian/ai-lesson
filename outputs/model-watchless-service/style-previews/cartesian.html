<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ede8e0;
            --bg-secondary: #e2dbd1;
            --text-primary: #1a1a1a;
            --text-secondary: #5a5a5a;
            --accent: #8a8178;
            --line: #b8b0a4;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        .presentation {
            width: 1920px;
            height: 1080px;
            position: relative;
        }

        .slide {
            width: 1920px;
            height: 1080px;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            display: flex;
            flex-direction: column;
            padding: 43.2px 76.8px;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* Geometric decorations */
        .geo-lines {
            position: absolute;
            top: 0;
            right: 0;
            width: 864px;
            height: 486px;
            pointer-events: none;
            z-index: 0;
        }

        .geo-circle {
            position: absolute;
            border: 1px solid var(--line);
            border-radius: 50%;
            opacity: 0.5;
        }

        .geo-arc {
            position: absolute;
            border: 1px dashed var(--line);
            border-radius: 50%;
            opacity: 0.3;
        }

        /* Navigation */
        .nav-dots {
            position: fixed;
            right: 38.4px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--line);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: var(--text-primary);
            transform: scale(1.3);
        }

        .slide-counter {
            position: fixed;
            bottom: 32.4px;
            right: 57.6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 2px;
            z-index: 100;
        }

        .nav-arrows {
            position: fixed;
            bottom: 32.4px;
            left: 57.6px;
            display: flex;
            gap: 16px;
            z-index: 100;
        }

        .nav-arrow {
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .nav-arrow:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        /* Typography */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            line-height: 1.1;
        }

        h1 {
            font-size: clamp(2.5rem, 96px, 4.5rem);
        }

        h2 {
            font-size: clamp(1.8rem, 67.2px, 3rem);
        }

        h3 {
            font-size: clamp(1.2rem, 38.4px, 1.6rem);
        }

        p, li {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.9rem, 23.04px, 1.1rem);
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            font-weight: 500;
        }

        /* Slide 1: Title */
        .slide-title {
            justify-content: center;
        }

        .slide-title .content {
            position: relative;
            z-index: 1;
            max-width: 1248px;
        }

        .slide-title .label {
            margin-bottom: 32.4px;
        }

        .slide-title h1 {

        }

        .slide-title .subtitle {

            color: var(--text-secondary);

        /* All geo-decoration instances are decorative overlays, not flex

        .slide-cards {

        .slide-linechart .chart-wrapper {

        /* Slide 8: Timeline */

            display: flex;

            margin-bottom: 64.8px;

        .slide-timeline .timeline-item {

            padding-right: 57.6px;

        .slide-team .team-member h4 {

        .slide-team .team-member span {

        /* Slide 10: Closing */

        .slide-closing .content {
            position: relative;

        .slide-closing h1 {

        .slide-closing p {

        .slide-closing .geo-ring {

        @media (max-aspect-ratio: 4/3) {

            .slide-team .team-grid {

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap" rel="stylesheet"/><style>/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* === FIXED CANVAS AND CHINESE TYPE SUPPORT === */
:root{--slide-bg:var(--bg-primary);--stage-bg:var(--bg-primary)} .deck,.stage,.presentation{width:1920px;height:1080px}.slide{width:1920px;height:1080px}.slide.active{visibility:visible;opacity:1}.layout-cover,.slide-title{display:flex}.nav-controls,.nav-arrows,.nav-dots,.keyboard-hint,.nav-hint,.slide-counter,.progress-bar{display:none}body{font-family:'Inter','Noto Sans SC',sans-serif}.slide-title .label{font-family:'Inter','Noto Sans SC',sans-serif;font-size:26px;margin-bottom:52px;color:var(--text-secondary)}.slide-title h1{font-family:'Playfair Display','Noto Serif SC',serif;font-size:144px;line-height:1.25;margin-bottom:40px}.slide-title .subtitle{font-family:'Inter','Noto Sans SC',sans-serif;font-size:46px;line-height:1.7}.slide-title{padding-left:154px}</style></head>

<div class="geo-decoration"></div>
<div class="content">
<div class="label">AGENTS / 底层逻辑 · 第三课</div>
<h1>前向传播</h1>
<p class="subtitle">一层一层，<br/>把数字算出来。</p>
</div>
</div>
<!-- Slide 2: Agenda -->

<!-- Slide 3: Statement -->

<!-- Slide 4: Bar Chart -->

<!-- Slide 5: Two Column -->

<!-- Slide 6: Three Cards -->

<!-- Slide 7: Line Chart -->

<!-- Slide 8: Timeline -->

<!-- Slide 9: Team -->

<!-- Slide 10: Closing -->

</div>
<!-- Navigation -->
<div class="nav-dots">
<div class="nav-dot active" data-slide="0"></div>









</div>
<div class="nav-arrows">
<button class="nav-arrow" id="prevBtn">←</button>
<button class="nav-arrow" id="nextBtn">→</button>

<span id="currentSlide">01</span> / <span id="totalSlides">10</span>

</div></div><script>
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.nav-dot');
        let currentSlide = 0;
        const totalSlides = slides.length;

        document.getElementById('totalSlides').textContent = String(totalSlides).padStart(2, '0');

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            document.getElementById('currentSlide').textContent = String(index + 1).padStart(2, '0');
            currentSlide = index;
        }

        function nextSlide() {
            const next = (currentSlide + 1) % totalSlides;
            showSlide(next);
        }

        function prevSlide() {
            const prev = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(prev);
        }

        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtn').addEventListener('click', prevSlide);

        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                showSlide(parseInt(dot.dataset.slide));
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        </script><script>function fitPreview(){const el=document.getElementById('previewStage'),k=Math.min(innerWidth/1920,innerHeight/1080);el.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`;}addEventListener('resize',fitPreview);fitPreview();</script></body>
