<script>

"use strict";
(() => {
  /** @typedef {'token'|'probability'|'context'|'weights'|'training'|'floating'|'multimodal'} LabId */
  /** @typedef {{id:LabId,name:string,title:string,intro:string,steps:string[],captions:string[],conclusion:string,boundary:string,section:string}} Experiment */
  /** @type {Experiment[]} */
  const experiments = [
    {id:'token',name:'Token 编码',title:'一句话，如何成为模型的输入',intro:'把自然语言转换成一串编号，再沿着对应关系找回文本。',steps:['原始文本','划分片段','映射编号','形成列表'],captions:['先选择一段文本。此时看到的是可阅读的字符，还不是模型使用的输入表示。','文本被划分为多个片段。将鼠标停在片段上，或用 Tab 聚焦，查看它与其他行的对应关系。','每个片段在这份演示词表中有一个编号。编号表示词表中的位置，不表示大小或重要程度。','编号按原文顺序组成列表；重复出现的同一片段使用相同编号。'],conclusion:'Token 不等于一个字。文字、词的一部分或标点，都可能成为分词单元；具体划分取决于分词器。',boundary:'所有片段及编号均为教学预设，不是实际模型的分词结果。这里不实现 BPE，也不把每个中文字固定为 1.5 个 Token。',section:'02'},
    {id:'probability',name:'下一 Token 概率',title:'一次调用，得到一组候选概率',intro:'切换输入，观察模型输出的形态，再查看各候选 Token 的含义。',steps:['输入列表','模型计算','概率分布','解释候选'],captions:['输入先被表示为 Token 列表，模型据此计算下一位置的候选概率。','模型结合输入与固定权重进行计算。本页只展示过程，不执行真实模型推理。','输出是整个候选集合的概率分布。三项示例概率合计 100%。','点击任意候选柱，查看该 Token 在演示词表中的对应片段。查看候选不等于模型已经选定它。'],conclusion:'裸模型的单次调用产生下一 Token 的概率分布。如何从中选择、继续调用并拼成回复，需要额外的生成流程。',boundary:'概率、输入编号与词表均为教学预设，不是实测结果。这里仅演示三个候选；真实词表通常远大于这个集合。',section:'03'},
    {id:'context',name:'上下文窗口',title:'把容量与当前占用分开看',intro:'添加消息块，观察占用变化。超出容量时，由你决定是否移除最早消息。',steps:['累计占用','比较容量','处理超限','理解限制'],captions:['每个消息块带有一个示意 Token 数量，已用容量等于这些数量之和。','比较“已用”与“上限”：未满、刚好满、超出是三个不同状态。','超限不会自动删除消息。可以手动移除最早消息，演示一种裁剪策略；若仍超限，需要继续处理。','能容纳内容不等于总能有效利用内容。此演示只计算容量，不生成虚构的记忆率或准确率。'],conclusion:'窗口上限、当前占用和模型处理效果是不同概念。实际接口的超限处理及输入输出预算，需要查阅对应说明。',boundary:'8、16、32 是便于观察的教学容量，消息计数也是预设值。手动裁剪只是策略示例，不代表所有服务都会丢弃最早消息。',section:'04'},
    {id:'weights',name:'权重与参数量',title:'一组数值，参与每一次计算',intro:'点选矩阵中的一个数值，再沿输入、权重与计算的关系理解参数。',steps:['输入','读取权重','执行计算','得到输出'],captions:['输入描述当前任务；本页的 Token 列表仅用于示意。','点选矩阵单元，查看一个参数的数值。矩阵中每一个数都属于模型参数。','模型架构规定如何组织运算，计算程序读取权重，并结合输入执行计算。','计算得到输出分布。只拿到一串权重数值，还不足以重建完整的调用过程。'],conclusion:'参数量是参数数值的数量，模型文件还需要配套的架构与配置。权重体积也不等于推理所需的全部内存。',boundary:'4 × 4 矩阵仅展示参数的样子，并不对应完整大模型。体积按十进制 GB 计算，只包含理想权重数据，不含量化元数据、配置、缓存和运行开销。',section:'06'},

  function drawWeights(step){
    const gb=parameterBillions*precision/8;
    return {controls:select('weight-size','完整模型的示例参数量',[7,16].map(n=>({label:n+'B · '+n*10+' 亿参数',value:n})),parameterBillions)+select('weight-precision','每个参数的存储位数',[32,16,8].map(n=>({label:n+' bit',value:n})),precision),body:`<div class="grid-two"><div>${panel('教学矩阵 · 4 × 4，共 16 个数值',matrix(weights,true),'orange',step===1)}<div class="matrix-detail">已选参数 ${mono('W['+(Math.floor(selectedWeight/4)+1)+', '+(selectedWeight%4+1)+']')} = <strong>${mono(weights[selectedWeight].toFixed(2))}</strong><br>正负号和大小表示数值，不直接等同于某个词或知识点。</div></div><div class="panel"><div class="panel-title">理想权重数据体积</div><div class="formula" style="border:0;margin-top:0;padding-top:0"><strong>${decimal(gb)}</strong> <span class="unit">GB</span><div class="mono">${parameterBillions} × 10⁹ × ${precision} ÷ 8 字节</div><small>1 字节 = 8 bit；1 GB = 10⁹ 字节。</small></div><p class="hint">${parameterBillions}B 表示 ${parameterBillions*10} 亿个参数，不是 ${parameterBillions} GB。左侧仅用 16 个预设数值说明矩阵形态，并非该模型的实际参数。</p><div class="formula"><strong style="font-size:18px;color:var(--ink)">架构 + 配置 + 权重</strong><p class="hint">还需要知道各层如何连接、采用什么运算，以及输入如何编码。</p></div></div></div><div class="mini-flow" aria-label="调用流程">${['输入 Token 列表','读取权重','依架构运算','输出概率分布'].map((label,i)=>`<div class="mini-step${i===step?' active':''}">${label}</div>`).join('')}</div>`};
  }
  /** @param {number} step */
  function drawTraining(step){
    const before=trainingMode==='train'?weights:trained,after=trainingMode==='train'?trained:tuned;
    // 中间值只用于视觉过渡；不将预设动画包装为模型训练结果。
    const factor=step<2?0:step===2?.5:1,shown=before.map((v,i)=>v+(after[i]-v)*factor);
    return {controls:select('training-mode','选择学习起点',[{label:'训练 · 从初始权重出发',value:'train'},{label:'微调 · 从已有权重出发',value:'fine'}],trainingMode),body:`<div class="training-caption"><span class="mode-name">${trainingMode==='train'?'初始权重 → 学习过程 → 训练后的权重':'已有模型权重 → 继续学习 → 调整后的权重'}</span></div><div class="corpus${step<1?' ghost':''}"><span>文本语料</span><span>代码语料</span><span>${trainingMode==='fine'?'特定任务样本':'多种训练样本'}</span><span>${step>=1?'语料参与学习':'第 2 步引入语料'}</span></div><div class="compare-grid"><section><h3>起点 · ${trainingMode==='train'?'初始权重':'已经训练过的权重'}</h3>${matrix(before,false)}</section><section><h3>${step<2?'尚未更新':step===2?'更新过程 · 示意过渡值':'结果 · 预设更新后的权重'}</h3>${matrix(shown,false,before)}</section></div><div class="change-legend">${step>=2?'橙色单元表示数值与起点不同。':'两个矩阵目前相同。点击下一步，观察语料与权重更新的关系。'}</div><div class="selection-note"><strong>推理阶段：</strong>输入使用已训练的权重进行计算，不执行本实验中的参数更新。微调并不必然只改变部分参数。</div>`};
  }
  /** @param {number} step */
  function drawFloating(step){
    const [a,b,c]=floatPresets[floatPreset].values,leftInner=a+b,rightInner=b+c,left=leftInner+c,right=a+rightInner;
    const leftActive=floatOrder==='left';
    /** @param {boolean} isLeft */
    const block=isLeft=>{
      const selected=isLeft===leftActive,visible=step>=2&&(selected||step===3),innerVisible=step>=1&&(selected||step===3);
      return `<div class="panel ${selected?'blue':''}"><div class="panel-title">${isLeft?'顺序 A · 先加前两个数':'顺序 B · 先加后两个数'}${selected?' · 当前演示':''}</div><div class="equation">${isLeft?`(${a} + ${b}) + ${c}`:`${a} + (${b} + ${c})`}</div><div class="calculation">${innerVisible?`第一步：${mono(isLeft?`${a} + ${b} = ${leftInner}`:`${b} + ${c} = ${rightInner}`)}`:'等待展开第一步计算。'}</div><p class="hint">最终结果</p><div class="result-number">${visible?String(isLeft?left:right):'—'}</div></div>`;
    };
    return {controls:select('float-preset','数值示例',indexed(floatPresets),floatPreset)+select('float-order','先演示哪种顺序',[{label:'A · (a + b) + c',value:'left'},{label:'B · a + (b + c)',value:'right'}],floatOrder),body:`<div class="grid-two">${block(true)}${block(false)}</div><div class="comparison"><span class="equality">${step===3?(left===right?'=':'≠'):'?'}</span><div>${step===3?`<strong>严格相等比较：${mono(String(left===right))}</strong><div class="hint" style="margin-top:3px">${left===right?'这一组得到相同结果；运算顺序不总是造成可见差异。':'两种顺序得到不同结果；显示的是实际数值，没有统一四舍五入。'}</div>`:'到第 4 步同时展开两种结果，并执行严格相等比较。'}</div></div>`};
  }
  /** @param {number} kind */
  function mediaVisual(kind){
    if(kind===0)return '<div class="text-visual">我喜欢学习</div>';
    if(kind===1)return '<svg viewBox="0 0 240 110" role="img" aria-label="分成小块的山景示意图"><rect x="44" y="5" width="152" height="96" rx="4" fill="#e4edf3"/><circle cx="158" cy="28" r="12" fill="#d9af79"/><path d="m44 94 49-59 27 36 25-26 51 49Z" fill="#8bafa0"/><path d="M82 5v96m38-96v96m38-96v96M44 37h152M44 69h152" stroke="#faf8f3" stroke-width="2"/></svg>';
    if(kind===2)return '<svg viewBox="0 0 240 110" role="img" aria-label="声音波形示意图"><path d="M5 55h18l8-12 8 24 10-47 10 70 10-55 10 32 10-12 10-36 10 76 10-59 10 31 10-12 10-18 10 36 10-65 10 85 10-57 10 31 10-12h20" fill="none" stroke="#245d80" stroke-width="3" stroke-linejoin="round"/></svg>';
    return '<svg viewBox="0 0 240 110" role="img" aria-label="三个连续视频帧的示意图"><g fill="#e4edf3" stroke="#9ab4c4"><rect x="5" y="20" width="65" height="60" rx="4"/><rect x="86" y="20" width="65" height="60" rx="4"/><rect x="167" y="20" width="65" height="60" rx="4"/></g><g fill="#286449"><circle cx="24" cy="51" r="10"/><circle cx="119" cy="51" r="10"/><circle cx="215" cy="51" r="10"/></g><path d="M70 94h162m-5-4 5 4-5 4" fill="none" stroke="#626563"/><text x="8" y="99" fill="#626563" font-size="12">时间</text></svg>';
  }
  /** @param {number} step */
  function drawMultimodal(step){
    const m=modes[modality];
    return {controls:select('modality','选择模态',modes.map((m,i)=>({label:m.name,value:i})),modality),body:`<div class="grid-two"><div class="panel blue${step===0?' focused':''}"><div class="panel-title">原始${m.name} · 图形示意</div><div class="media-visual">${mediaVisual(modality)}</div></div><div class="panel${step===1?' focused':''}"><div class="panel-title">数字表示</div><div class="representation${step<1?' ghost':''}">${m.representation}${step>=1?`<span class="mono">${m.numbers}</span>`:'<span class="mono">第 2 步展开</span>'}</div></div></div><div class="mini-flow"><div class="mini-step${step===2?' active':''}">适配该模态的模型处理</div><div class="mini-step${step===3?' active':''}">${m.output}</div></div><p class="hint">${m.description}</p><div class="selection-note">${step>=3?'输出可能是文字，也可能是其他模态。需要什么解码过程，由具体模型与任务决定。':'先观察表示的变化，再逐步查看模型处理与输出解释。'}</div>`};
  }
  /** @param {number} delta */
  function advance(delta){stop();steps[current]=Math.max(0,Math.min(3,steps[current]+delta));render();announce(definition().captions[steps[current]]);}
  function schedule(){
    timer=window.setTimeout(()=>{
      if(!playing||document.hidden||motionPreference.matches){stop();render();return;}
      steps[current]=Math.min(3,steps[current]+1);
      if(steps[current]===3)stop();
      render();announce(definition().steps[steps[current]]);
      if(playing)schedule();
    },1500);
  }
  function togglePlayback(){
    if(motionPreference.matches)return;
    if(playing){stop();render();return;}
    if(steps[current]===3)steps[current]=0;
    playing=true;render();schedule();
  }
  function reset(){
    stop();steps[current]=0;
    switch(current){
      case 'token':tokenPreset=0;break;
      case 'probability':probabilityPreset=0;candidate=0;break;
      case 'context':capacity=16;addSize=4;messages=initialMessages();messageSerial=3;break;
      case 'weights':selectedWeight=0;parameterBillions=7;precision=16;break;
      case 'training':trainingMode='train';break;
      case 'floating':floatPreset=0;floatOrder='left';break;
      case 'multimodal':modality=0;break;
    }
    render();announce('当前实验已恢复初始设置。');
  }
  /** @param {string} [index] */
  function highlightToken(index){host.querySelectorAll('[data-token]').forEach(el=>{el.classList.toggle('matched',index!==undefined&&el.getAttribute('data-token')===index);});}
  host.addEventListener('click',event=>{
    if(!(event.target instanceof Element))return;
    const target=event.target.closest('button');if(!(target instanceof HTMLButtonElement)||target.disabled)return;
    if(target.dataset.candidate!==undefined){candidate=Number(target.dataset.candidate);render();announce('当前候选对应 '+probabilityPresets[probabilityPreset].candidates[candidate].text);return;}
    if(target.dataset.weight!==undefined){selectedWeight=Number(target.dataset.weight);render();return;}
    if(target.dataset.remove!==undefined){stop();const id=Number(target.dataset.remove);messages=messages.filter(m=>m.id!==id);render();element('add-message').focus();announce('已移除消息，当前占用 '+messages.reduce((n,m)=>n+m.count,0)+' Token。');return;}
    switch(target.dataset.action){
      case 'previous':advance(-1);return;
      case 'next':advance(1);return;
      case 'play':togglePlayback();return;
      case 'reset':reset();return;
      case 'add-message':if(messages.length<12){stop();messageSerial++;messages.push({id:messageSerial,label:'新增消息 '+messageSerial,count:addSize});}break;
      case 'remove-oldest':stop();messages.shift();break;
      case 'clear-messages':stop();messages=[];break;
      default:return;
    }
    render();announce('当前共 '+messages.length+' 个消息块，合计 '+messages.reduce((n,m)=>n+m.count,0)+' Token。');
  });
  host.addEventListener('change',event=>{
    const t=event.target;if(!(t instanceof HTMLSelectElement))return;
    stop();const value=Number(t.value);
    switch(t.id){
      case 'token-preset':tokenPreset=value;steps.token=0;break;
      case 'probability-preset':probabilityPreset=value;candidate=0;steps.probability=0;break;
      case 'context-capacity':capacity=value;break;
      case 'context-size':addSize=value;break;
      case 'weight-size':parameterBillions=value;break;
      case 'weight-precision':precision=value;break;
      case 'training-mode':trainingMode=t.value;steps.training=0;break;
      case 'float-preset':floatPreset=value;steps.floating=0;break;
      case 'float-order':floatOrder=t.value;steps.floating=0;break;
      case 'modality':modality=value;steps.multimodal=0;break;
      default:return;
    }
    render();announce('已更新实验设置，播放已暂停。');
  });
  // 焦点与鼠标共用映射高亮，键盘用户无需依赖悬停。
  host.addEventListener('pointerover',event=>{if(event.target instanceof Element){const token=event.target.closest('[data-token]');if(token)highlightToken(token.getAttribute('data-token')||undefined);}});
  host.addEventListener('pointerout',event=>{if(event.relatedTarget instanceof Element){const next=event.relatedTarget.closest('[data-token]');if(next){highlightToken(next.getAttribute('data-token')||undefined);return;}}const active=document.activeElement;highlightToken(active instanceof HTMLElement?active.dataset.token:undefined);});
  host.addEventListener('focusin',event=>{if(event.target instanceof HTMLElement)highlightToken(event.target.dataset.token);});
  host.addEventListener('focusout',event=>{const next=event.relatedTarget;highlightToken(next instanceof HTMLElement?next.dataset.token:undefined);});
  /** @param {boolean} [focusHeading] */
  function route(focusHeading=true){
    const id=location.hash.slice(1),found=experiments.find(e=>e.id===id);
    if(!found && id==='main')return;
    stop();current=found?found.id:'token';render(false);
    if(focusHeading){element('lesson-title').focus({preventScroll:true});announce('已切换到 '+definition().name+'，保留此前步骤。');}
  }
  window.addEventListener('hashchange',()=>route());
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();render();}});
  motionPreference.addEventListener('change',()=>{stop();render();});
  window.addEventListener('pagehide',stop);
  route(false);
})();

</script>
</body>
</html>
