name: Publish course website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - outputs/**
      - scripts/build_pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            index.html
            outputs
            scripts/build_pages.py
          sparse-checkout-cone-mode: false
      - uses: actions/configure-pages@v5
      - name: Package course pages and validate local links
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
